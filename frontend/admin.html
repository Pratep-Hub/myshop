<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="./admin-light.css"/>
  <title>Admin</title>
</head>
<body>
  <header class="header">
    <div class="h-left">
      <div class="logo">MyShop Admin</div>
      <div class="chip" id="apiBase"></div>
    </div>
    <div class="h-right">
      <a class="btn" href="./index.html">Customer View</a>
      <button class="btn danger" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="wrap">
    <!-- Login -->
    <section class="panel" id="loginCard">
      <h2>Login</h2>
      <div class="grid2">
        <div><label>Username</label><input id="user" placeholder="Admin"/></div>
        <div><label>Password</label><input id="pass" type="password" placeholder="••••••••"/></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" onclick="login()">Login</button>
        <span id="loginMsg"></span>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="dash" style="display:none">
      <div class="titlebar">
        <div>
          <h1>Dashboard</h1>
          <div class="muted">Simple admin panel (fast)</div>
        </div>
        <div class="chip" id="who">Logged in</div>
      </div>

      <!-- Quick stats -->
      <div class="stats">
        <div class="stat">
          <div class="muted">Products</div>
          <div class="big" id="statProducts">—</div>
        </div>
        <div class="stat">
          <div class="muted">Orders</div>
          <div class="big" id="statOrders">—</div>
        </div>
        <div class="stat">
          <div class="muted">Categories</div>
          <div class="big" id="statCats">—</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="orders" onclick="openTab('orders')">Orders</button>
        <button class="tab" data-tab="products" onclick="openTab('products')">Products</button>
        <button class="tab" data-tab="add" onclick="openTab('add')">Add Product</button>
        <button class="tab" data-tab="cats" onclick="openTab('cats')">Categories</button>
      </div>

      <!-- Orders tab -->
      <section class="panel tabPane" id="tab-orders">
        <div class="row space">
          <h3 style="margin:0">Orders</h3>
          <button class="btn" onclick="loadOrders()">Refresh</button>
        </div>
        <div id="ordersMsg"></div>
        <div class="tableWrap">
          <table class="table" id="ordersTable">
            <thead>
              <tr>
                <th>ID</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Time</th><th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- Items modal -->
        <dialog id="itemsModal" class="modal">
          <div class="modalHead">
            <b>Order Items</b>
            <button class="btn" onclick="closeItems()">Close</button>
          </div>
          <div id="itemsBody" class="muted"></div>
        </dialog>
      </section>

      <!-- Products tab -->
      <section class="panel tabPane" id="tab-products" style="display:none">
        <div class="row space">
          <h3 style="margin:0">Products</h3>
          <button class="btn" onclick="loadProducts()">Refresh</button>
        </div>
        <div id="productsList" class="muted">Loading...</div>
      </section>

      <!-- Add product tab -->
      <section class="panel tabPane" id="tab-add" style="display:none">
        <h3>Add Product</h3>

        <label>Category</label>
        <select id="prodCategory"></select>

        <div class="grid2" style="margin-top:10px">
          <div><label>Product name</label><input id="prodName" placeholder="e.g., Steel Bottle"/></div>
          <div><label>Price</label><input id="prodPrice" type="number" placeholder="299"/></div>
        </div>

        <div class="grid2" style="margin-top:10px">
          <div><label>Star rating (0-5)</label><input id="prodRating" type="number" step="0.1" placeholder="4.5"/></div>
          <div>
            <label>Active</label>
            <select id="prodActive"><option value="true" selected>Yes</option><option value="false">No</option></select>
          </div>
        </div>

        <label style="margin-top:10px">Description</label>
        <textarea id="prodDesc" placeholder="Product description..."></textarea>

        <div class="divider"></div>

        <div class="row space">
          <div>
            <h4 style="margin:0">Image Upload</h4>
            <div class="muted small">Auto compress (1600px, ~82% quality). Max 2MB.</div>
          </div>
          <button class="btn" onclick="uploadImage()">Upload</button>
        </div>

        <div class="row" style="margin-top:10px">
          <input id="prodImageFile" type="file" accept="image/*"/>
          <input id="prodImageUrl" placeholder="Image URL auto fill after upload"/>
        </div>
        <div id="uploadMsg"></div>

        <div class="row" style="margin-top:12px">
          <button class="btn primary" onclick="addProduct()">Add Product</button>
          <span id="prodMsg"></span>
        </div>
      </section>

      <!-- Categories tab -->
      <section class="panel tabPane" id="tab-cats" style="display:none">
        <div class="row space">
          <h3 style="margin:0">Categories</h3>
          <button class="btn" onclick="loadCategories()">Refresh</button>
        </div>

        <div class="row" style="margin-top:10px">
          <input id="catName" placeholder="New category name"/>
          <button class="btn primary" onclick="addCategory()">Add</button>
        </div>
        <div id="catMsg"></div>
        <div class="divider"></div>
        <div id="catList" class="muted">Loading...</div>
      </section>
    </section>
  </main>

  <script src="./admin.js"></script>
  <script>
    function openTab(name){
      document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.tab===name));
      document.querySelectorAll(".tabPane").forEach(p=>p.style.display="none");
      document.getElementById("tab-"+name).style.display="";
    }
  </script>
</body>
</html>
